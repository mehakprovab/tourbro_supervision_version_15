    <script>
        (function () {
            var currentPath = window.location.pathname.replace(/\/+$/, '');
            var currentHash = window.location.hash || '';
            if (/\/supplier$/i.test(currentPath) || /supplier-login/i.test(currentHash)) {
                document.title = 'Supplier';
            }
            if (/\/supplier$/i.test(currentPath)) {
                if (!window.location.hash) {
                    window.location.replace(window.location.pathname.replace(/\/?$/, '/') + window.location.search + '#/auth/supplier-login');
                } else if (/^#\/auth\/login\/?$/i.test(currentHash)) {
                    window.location.replace(window.location.pathname.replace(/\/?$/, '/') + window.location.search + '#/auth/supplier-login');
                }
            }
        })();
    </script>
