<div class="module-selector-wrapper">
  <div class="container">
    <div class="selector-card">
      <div class="selector-header">
        <h2 class="selector-title">Select Your Services</h2>
        <p class="selector-subtitle">Please select the services you wish to provide</p>
      </div>

      <div class="options-grid">
        <div 
          class="option-card" 
          *ngFor="let module of moduleOptions"
          (click)="toggleModule(module.value)" 
          [class.selected]="isSelected(module.value)"
        >
          <div class="option-icon">
            <i [class]="module.iconClass"></i>
          </div>
          <h3 class="option-title">{{ module.title }}</h3>
          <p class="option-description">{{ module.description }}</p>
        </div>
      </div>

      <div class="selector-footer">
        <button 
          class="proceed-btn" 
          (click)="proceedToNext()" 
          [disabled]="selectedModules.length === 0"
          [class.disabled]="selectedModules.length === 0"
        >
          Proceed
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <line x1="5" y1="12" x2="19" y2="12"></line>
            <polyline points="12 5 19 12 12 19"></polyline>
          </svg>
        </button>
        <p *ngIf="selectedModules.length === 0" class="error-message">Please select at least one service to proceed</p>
      </div>
    </div>
  </div>
</div>

<div class="searchload" *ngIf="isLoading">
  <div class="loader-spinner">
    <div class="spinner"></div>
    <p>Loading...</p>
  </div>
</div>
