<div class="card adminInner" style="padding: 20px;">
  <div class="card-header mb-3">
    <h5>Supplier Legal Content</h5>
  </div>

  <div class="custom-inline-form">
    <form [formGroup]="legalForm" autocomplete="off">
      <div class="form-group required row">
        <label class="col-sm-2 col-form-label">Content Type</label>
        <div class="col-sm-4">
          <select class="form-control" formControlName="contentType" (change)="onContentTypeChange()">
            <option value="" disabled>Select content type</option>
            <option *ngFor="let item of contentTypes" [value]="item.value">{{ item.label }}</option>
          </select>
        </div>
      </div>

      <div class="form-group required row">
        <label class="col-sm-2 col-form-label">Content</label>
        <div class="col-sm-10">
          <div *ngIf="isLoading" class="text-muted">Loading saved content...</div>
          <ckeditor *ngIf="!isLoading" formControlName="content" [(config)]="editorConfig"></ckeditor>
        </div>
      </div>

      <div class="form-group row mb-n2">
        <div class="col-sm-12 customCenter">
          <button type="button" class="btn btn-sm btn-primary mr-1" (click)="onSubmit()">Submit</button>
        </div>
      </div>
    </form>
  </div>
</div>
