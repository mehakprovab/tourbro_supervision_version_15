            <div class="booking-card-header">
                <span>{{ card.label }}</span>
                <!-- <select class="booking-card-filter"
                    *ngIf="card.filter"
                    [value]="getCardFilter(card.key)"
                    (change)="onCardFilterChange(card.key, getEventValue($event))">
                    <option *ngFor="let option of filterOptions" [value]="option.value">
                        {{ option.label }}
                    </option>
                </select> -->
            </div>

            <div class="booking-card-value">{{ card.value | number:'1.2-2' }}</div>
        </div>
    </div>
</div>

<div class="col-12 revenue-finance-top-sec mt-3 pb-3 pt-3">

    <div class="row">
        <div class="col-12 py-2">
            <span class="revenue-span">Lead & Sales Funnel</span>
        </div>

        <div class="col-12">
            <div class="row g-3">
                <div class="col-md-12">
                    <div class="head-sect py-3 px-3">
                        <div class="row">
                            <div class="col-8">
                                <span class="f-15">Enquiry Generated</span>
                            </div>

                            <div class="col-4 text-end">
                                <select class="b-none"
                                    [value]="enquiryGeneratedFilter"
                                    (change)="onEnquiryGeneratedFilterChange(getEventValue($event))">
                                    <option value="today">Today</option>
                                    <option value="yesterday">Last Day</option>
                                    <option value="thisWeek">Last Week</option>
                                    <option value="thisMonth">Last Month</option>
                                    <option value="all">All</option>
                                </select>
                            </div>

                            <!-- <div class="col-12 mt-2">

                            <div class="col-12 mt-2">

                    </div>
                </div>

            

            </div>
        </div>
