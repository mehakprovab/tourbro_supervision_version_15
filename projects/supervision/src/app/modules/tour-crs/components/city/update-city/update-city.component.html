<div class="card adminInner">
  <div class="card-header mb-3">
    <h5>Edit City</h5>
  </div>

  <form [formGroup]="cityForm" (ngSubmit)="onCityUpdate()">
<div class="form-row">
    <!-- State Dropdown -->
     <div class="col-md-4">
      <label>Choose State</label>
      <select class="form-control" formControlName="state_id">
        <option value="" disabled>Select State</option>
        <option *ngFor="let state of stateList" [value]="state.id">
          {{ state.name }}
        </option>
      </select>
       <div *ngIf="f.state_id.touched && f.state_id.errors">
      <small class="errorMessage">*Please select state</small>
    </div>
    </div>

   

    <!-- City Name -->
     <div class="col-md-4">
      <label>City Name</label>
      <input type="text" class="form-control" formControlName="city_name">
        <div *ngIf="f.city_name.touched && f.city_name.errors">
      <small *ngIf="f.city_name.errors.required" class="errorMessage">*Required</small>
      <small *ngIf="f.city_name.errors.invalidString" class="errorMessage">*Numbers not allowed</small>
      <small *ngIf="f.city_name.errors.startOrEndSpace" class="errorMessage">*No space at start/end</small>
      <small *ngIf="f.city_name.errors.invalidLocationName" class="errorMessage">*Special characters are not allowed</small>
    </div>
    </div>

  

    <!-- Latitude -->
     <!-- <div class="col-md-4">
      <label>Latitude</label>
      <input type="text" class="form-control" formControlName="latitude">
    </div> -->

    <!-- Longitude -->
     <!-- <div class="col-md-4">
      <label>Longitude</label>
      <input type="text" class="form-control" formControlName="longitude">
    </div> -->
 <div class="col-md-4">
  <label>Status</label>

  <div class="toggleSwitch d-flex align-items-center">
    
    <mat-slide-toggle
      [checked]="cityForm.get('status').value === 1"
      (change)="onStatusChange($event)"
    >
    </mat-slide-toggle>

    <span class="ml-2">
      {{ cityForm.get('status').value === 1 ? 'Active' : 'Inactive' }}
    </span>

  </div>
</div>
</div>

<div class="form-row mt-3">
  <div class="col-md-4 mb-3">
    <label>City Image</label>
    <div class="custom-file">
      <input type="file" class="custom-file-input" id="editCityImage" accept="image/*"
        (change)="onImageSelected($event)">
      <label class="custom-file-label" for="editCityImage">
        {{ selectedImageFile ? selectedImageFile.name : 'Choose file' }}
      </label>
    </div>
    <div *ngIf="imagePreviewUrl" class="mt-2">
      <img [src]="imagePreviewUrl" alt="City image" class="img-thumbnail"
        style="max-width: 100px; max-height: 100px;">
    </div>
  </div>

  <div class="col-md-4 mb-3">
    <label>Hourly Rental</label>
    <div class="d-flex align-items-center">
      <mat-slide-toggle formControlName="hourly_rental" (change)="onHourlyRentalChange($event)">
      </mat-slide-toggle>
      <span class="ml-2">{{ cityForm.get('hourly_rental').value ? 'Yes' : 'No' }}</span>
    </div>
  </div>

  <div class="col-md-4 mb-3" *ngIf="cityForm.get('hourly_rental').value">
    <label>Hourly Durations</label>
    <select class="form-control" formControlName="hourly_durations">
      <option value="" disabled>Select duration</option>
      <option value="2 hours">2 hours</option>
      <option value="4 hours">4 hours</option>
      <option value="6 hours">6 hours</option>
      <option value="8 hours">8 hours</option>
      <option value="12 hours">12 hours</option>
      <option value="24 hours">24 hours</option>
    </select>
    <small *ngIf="f.hourly_durations.touched && f.hourly_durations.errors?.required" class="errorMessage">
      *Please select hourly duration
    </small>
  </div>
</div>

<div class="form-row">
  <div class="col-md-12 mb-3">
    <label>Description</label>
    <textarea class="form-control" formControlName="discription" placeholder="Enter city description"
      rows="4" maxlength="500"></textarea>
  </div>
</div>
    <!-- Buttons -->
    <div class="saveButton mt-3">
      <button type="submit" class="btn btn-primary mr-2">Update</button>
      <button type="button" class="btn btn-secondary" routerLink="/tour-crs/city">
        City List
      </button>
    </div>

  </form>
</div>
