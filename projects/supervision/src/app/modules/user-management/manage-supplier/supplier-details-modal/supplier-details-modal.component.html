<div class="modal-dis">
  <div class="container">
    <div class="modal supplier-details-modal" [style.display]="visible ? 'block' : 'none'">
  <div class="modal-dialog modal-xl">
    <div class="modal-content">
      <div class="modal-header">
        <h4 class="modal-title">Supplier Details</h4>
        <button type="button" class="close" aria-label="Close" (click)="close()">&times;</button>
      </div>

      <div class="modal-body">
        <div *ngIf="loading" class="py-4 text-center">
          <mat-spinner [diameter]="35" style="margin: 0 auto;" mode="indeterminate"></mat-spinner>
        </div>

        <div *ngIf="!loading && errorMessage" class="alert alert-warning mb-0">
          {{ errorMessage }}
        </div>

        <div *ngIf="!loading && !errorMessage && documentFields.length" class="documents-section mb-4">
          <h5 class="section-title">Documents</h5>
          <div class="row">
            <div class="col-md-4 mb-3" *ngFor="let document of documentFields">
              <div class="document-card">
                <div class="font-weight-bold mb-2">{{ getDocumentLabel(document) }}</div>
                <a class="btn btn-sm btn-primary"
                  [href]="document.documentUrl"
                  [attr.download]="document.documentName"
                  target="_blank"
                  rel="noopener noreferrer">
                  <i class="fa fa-download mr-1"></i> Download
                </a>
              </div>
            </div>
          </div>
        </div>

        <div *ngIf="!loading && !errorMessage" class="row">
          <div class="col-md-6 detail-row" *ngFor="let field of detailFields">
            <div class="detail-label">{{ field.label }}</div>
            <div class="detail-value">
              {{ field.value }}
            </div>
          </div>
        </div>
      </div>

    
    </div>
  </div>
</div>
<div *ngIf="visible" class="modal-backdrop show"></div>

  </div>
</div>
